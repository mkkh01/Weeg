services:
  - type: web
    name: weeg-trading-dashboard
    runtime: python
    buildCommand: python3 -m venv .venv && .venv/bin/pip install -r requirements.txt
    startCommand: venv/bin/python main.py
    healthCheckPath: /api/health
    envVars:
      - key: SUPABASE_URL
        value: https://ymjancsrnmunkyaomdsx.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SYMBOLS
        value: BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,ADAUSDT,DOGEUSDT,AVAXUSDT,LINKUSDT,DOTUSDT,TRXUSDT,LTCUSDT,BCHUSDT,UNIUSDT,ETCUSDT,ATOMUSDT,XLMUSDT,NEARUSDT,FILUSDT,APTUSDT,ARBUSDT,OPUSDT,INJUSDT,SUIUSDT,SEIUSDT,ICPUSDT,VETUSDT,ALGOUSDT,AAVEUSDT,RENDERUSDT
      - key: DEFAULT_INTERVAL
        value: 15m
      - key: CORS_ORIGINS
        value: '*'

